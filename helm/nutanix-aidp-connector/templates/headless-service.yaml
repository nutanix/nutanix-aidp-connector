#
# Headless Service required by StatefulSet for stable pod DNS names.
# Each pod gets a DNS entry: <pod-name>.<headless-svc>.<namespace>.svc.cluster.local

apiVersion: v1
kind: Service
metadata:
  name: {{ include "nutanix-aidp-connector.fullname" . }}-headless
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "nutanix-aidp-connector.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "nutanix-aidp-connector.selectorLabels" . | nindent 4 }}
  ports:
    - name: config-api
      port: {{ .Values.service.configApiPort }}
      targetPort: {{ .Values.service.configApiPort }}
      protocol: TCP
    - name: metrics
      port: {{ .Values.telemetry.prometheusPort | default 9090 }}
      targetPort: {{ .Values.telemetry.prometheusPort | default 9090 }}
      protocol: TCP
