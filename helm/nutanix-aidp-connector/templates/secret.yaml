apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nutanix-aidp-connector.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "nutanix-aidp-connector.labels" . | nindent 4 }}
type: Opaque
data:
  # S3 credentials (for reading objects after Kafka notifications)
  s3-access-key: {{ .Values.s3.accessKey | default "" | b64enc | quote }}
  s3-secret-key: {{ .Values.s3.secretKey | default "" | b64enc | quote }}
  # Objects storage credentials (for Milvus/NeMo-Retriever storage)
  objects-access-key: {{ .Values.storage.objects.accessKey | default "" | b64enc | quote }}
  objects-secret-key: {{ .Values.storage.objects.secretKey | default "" | b64enc | quote }}

