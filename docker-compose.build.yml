# Docker Compose configuration for containerized builds
# This ensures consistent build environments across all developers

version: '3.8'

services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: nutanix-aidp-connector-builder:latest
    container_name: nutanix-aidp-connector-builder
    volumes:
      # Mount source code for live editing
      - ./nutanix_aidp_connector:/workspace/nutanix_aidp_connector:ro
      - ./tests:/workspace/tests:ro
      - ./scripts:/workspace/scripts:ro
      - ./requirements.txt:/workspace/requirements.txt:ro
      - ./pytest.ini:/workspace/pytest.ini:ro
      # Mount Docker socket for building images (if needed)
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount project root for build context
      - .:/workspace/project:rw
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/nutanix_aidp_connector
      - PIPELINE_CONFIG=/workspace/nutanix_aidp_connector/config/config.yaml
    # Keep container running for interactive use
    stdin_open: true
    tty: true
    command: /bin/bash

  test:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: nutanix-aidp-connector-builder:latest
    container_name: nutanix-aidp-connector-test
    volumes:
      - ./nutanix_aidp_connector:/workspace/nutanix_aidp_connector:ro
      - ./tests:/workspace/tests:ro
      - ./pytest.ini:/workspace/pytest.ini:ro
      - ./requirements.txt:/workspace/requirements.txt:ro
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/nutanix_aidp_connector
      - PIPELINE_CONFIG=/workspace/nutanix_aidp_connector/config/config.yaml
    command: pytest tests/ -v

  lint:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: nutanix-aidp-connector-builder:latest
    container_name: nutanix-aidp-connector-lint
    volumes:
      - ./nutanix_aidp_connector:/workspace/nutanix_aidp_connector:ro
      - ./tests:/workspace/tests:ro
    working_dir: /workspace
    command: >
      sh -c "
        echo 'Running flake8...' &&
        flake8 nutanix_aidp_connector/ tests/ --max-line-length=120 --exclude=__pycache__,.git,*.pyc &&
        echo 'Running pylint...' &&
        pylint nutanix_aidp_connector/ --disable=C0111,C0103,R0913,W0613 || true &&
        echo 'Linting complete!'
      "

  build-image:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: nutanix-aidp-connector-builder:latest
    container_name: nutanix-aidp-connector-build-image
    volumes:
      - .:/workspace/project:rw
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace/project
    environment:
      - DOCKER_BUILDKIT=1
    # This service is meant to be run with docker-compose run, not started automatically
    profiles:
      - build
